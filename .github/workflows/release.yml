name: Release

# The single source of truth for the version is MARKETING_VERSION in
# imp-rec.xcodeproj/project.xcproj (imp-rec/Info.plist uses $(MARKETING_VERSION) /
# $(CURRENT_PROJECT_VERSION)).
#
# Note: v0.0.26 was uploaded to App Store Connect with build 28 (from the old
# github.run_number scheme). Because apple-release derives CFBundleVersion as
# x*10000 + y*100 + z, bump the next version to at least 0.0.29 (or 0.1.0 -> 100)
# so build numbers stay strictly increasing.
on:
  push:
    branches: [main]
    paths:
      - 'imp-rec.xcodeproj/project.xcproj'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Actually upload to ASC / create GitHub Release / update Homebrew cask (unchecked = rehearsal only)'
        type: boolean
        default: false
      build-number:
        description: 'Override CFBundleVersion (empty = derive x*10000 + y*100 + z from version)'
        type: string
        default: ''

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
      build_number: ${{ steps.read.outputs.build_number }}
      run: ${{ steps.read.outputs.run }}
      publish: ${{ steps.read.outputs.publish }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - id: check
        uses: rxliuli/version-check@v1
        with:
          file: imp-rec.xcodeproj/project.xcproj

      - id: read
        name: Resolve build number and publish mode
        run: |
          VERSION="${{ steps.check.outputs.version }}"
          if [[ -z "$VERSION" ]]; then
            echo "::error::Could not read MARKETING_VERSION from imp-rec.xcodeproj/project.xcproj"
            exit 1
          fi

          RUN=false
          if [[ "${{ github.event_name }}" == "workflow_dispatch" || "${{ steps.check.outputs.changed }}" == "true" ]]; then
            RUN=true
          fi

          PUBLISH=false
          if [[ "$RUN" == "true" ]] && { [[ "${{ github.event_name }}" == "push" ]] || [[ "${{ inputs.publish }}" == "true" ]]; }; then
            PUBLISH=true
          fi

          BUILD_NUMBER="${{ inputs.build-number }}"
          if [[ -z "$BUILD_NUMBER" ]]; then
            IFS='.' read -r MAJOR MINOR PATCH <<< "${VERSION}"
            BUILD_NUMBER=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          fi
          if ! [[ "$BUILD_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "::error::Derived build number '${BUILD_NUMBER}' is invalid (expected x.y.z version, got '${VERSION}')"
            exit 1
          fi

          {
            echo "version=${VERSION}"
            echo "build_number=${BUILD_NUMBER}"
            echo "run=${RUN}"
            echo "publish=${PUBLISH}"
          } >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}  build=${BUILD_NUMBER}  run=${RUN}  publish=${PUBLISH}"

  appstore:
    name: macOS → App Store Connect
    needs: version
    if: needs.version.outputs.run == 'true'
    # imp-rec.xcodeproj uses Xcode's JSON project format (project.xcproj), which requires
    # Xcode 27+. Switch back to macos-latest once it ships Xcode 27+.
    runs-on: xcode-27
    timeout-minutes: 40
    environment: release-macOS
    steps:
      - uses: actions/checkout@v6

      - name: Select Xcode 27.2
        run: |
          if [ -d /Applications/Xcode_27.2.app ]; then
            sudo xcode-select -s /Applications/Xcode_27.2.app/Contents/Developer
          fi
          xcodebuild -version

      - uses: rxliuli/apple-release/asc@v1
        with:
          platform: macos
          scheme: imp-rec
          project: imp-rec.xcodeproj
          version: ${{ needs.version.outputs.version }}
          build-number: ${{ needs.version.outputs.build_number }}
          team-id: N2X78TUUFG
          release: ${{ needs.version.outputs.publish }}
          certificate-base64: ${{ secrets.APPLE_CERTIFICATE_DEVELOPERID_BASE64 }}
          certificate-password: ${{ secrets.APPLE_CERTIFICATE_DEVELOPERID_PASSWORD }}
          api-key: ${{ secrets.APPLE_API_KEY }}
          api-key-id: ${{ secrets.APPLE_API_KEY_ID }}
          api-issuer: ${{ secrets.APPLE_API_ISSUER }}

  appstore-submit:
    name: macOS → App Store review
    needs: [version, appstore]
    if: needs.version.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    environment: release-macOS
    steps:
      - uses: rxliuli/apple-release/submit@v1
        with:
          platform: macos
          bundle-id: com.rxliuli.imp-rec
          version: ${{ needs.version.outputs.version }}
          build-number: ${{ needs.version.outputs.build_number }}
          release: ${{ needs.version.outputs.publish }}
          api-key: ${{ secrets.APPLE_API_KEY }}
          api-key-id: ${{ secrets.APPLE_API_KEY_ID }}
          api-issuer: ${{ secrets.APPLE_API_ISSUER }}

  macos-dmg:
    name: macOS → notarized DMG
    needs: version
    if: needs.version.outputs.run == 'true'
    runs-on: xcode-27
    timeout-minutes: 60
    environment: release-macOS
    steps:
      - uses: actions/checkout@v6

      - name: Select Xcode 27.2
        run: |
          if [ -d /Applications/Xcode_27.2.app ]; then
            sudo xcode-select -s /Applications/Xcode_27.2.app/Contents/Developer
          fi
          xcodebuild -version

      - uses: rxliuli/apple-release/dmg@v1
        id: dmg
        with:
          project: imp-rec.xcodeproj
          scheme: imp-rec
          version: ${{ needs.version.outputs.version }}
          build-number: ${{ needs.version.outputs.build_number }}
          signing-identity: ${{ vars.SIGNING_IDENTITY_DMG }}
          certificate-base64: ${{ secrets.APPLE_CERTIFICATE_DEVELOPERID_BASE64 }}
          certificate-password: ${{ secrets.APPLE_CERTIFICATE_DEVELOPERID_PASSWORD }}
          api-key: ${{ secrets.APPLE_API_KEY }}
          api-key-id: ${{ secrets.APPLE_API_KEY_ID }}
          api-issuer: ${{ secrets.APPLE_API_ISSUER }}

      - uses: actions/upload-artifact@v7
        with:
          name: macos-dmg
          path: ${{ steps.dmg.outputs.dmg-path }}
          if-no-files-found: error

  release:
    name: GitHub Release + Homebrew cask
    needs: [version, appstore, macos-dmg]
    if: >-
      always()
      && needs.version.outputs.publish == 'true'
      && needs.appstore.result == 'success'
      && needs.macos-dmg.result == 'success'
    runs-on: ubuntu-latest
    environment: release-macOS
    env:
      TAP_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: macos-dmg

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          TAG="v${VERSION}"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "${TAG} already exists, replacing attachment"
            gh release upload "$TAG" ImpRec-macos.dmg --clobber --repo "${{ github.repository }}"
          else
            gh release create "$TAG" \
              --title "Release ${TAG}" \
              --generate-notes \
              --repo "${{ github.repository }}" \
              ImpRec-macos.dmg
          fi

      - name: Update Homebrew tap
        if: env.TAP_TOKEN != ''
        uses: rxliuli/apple-release/tap-update@v1
        with:
          cask: imp-rec
          version: ${{ needs.version.outputs.version }}
          artifact: ImpRec-macos.dmg
          token: ${{ env.TAP_TOKEN }}
